# Sample compose for the portal: docker compose up -d --build
# Set JUNCTURA_UPSTREAM to the base URL of the running Junctura stack.

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: junctura-health-portal
    init: true
    ports:
      # Loopback by default: put a TLS reverse proxy in front (see docs/PORTAL.md).
      - "${PORTAL_BIND:-127.0.0.1}:5180:5180"
    environment:
      JUNCTURA_UPSTREAM: ${JUNCTURA_UPSTREAM:-http://host.docker.internal:8080}
      # The Caddyfile proxies /api/* to the backend service below.
      PORTAL_API_UPSTREAM: ${PORTAL_API_UPSTREAM:-http://api:5190}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: junctura-health-portal-api
    init: true
    environment:
      # The API is only reachable inside the compose network (no published ports).
      HOST: 0.0.0.0
    env_file:
      # Workspace connection settings and credentials. See docs/PORTAL.md.
      - path: ${PORTAL_API_ENV_FILE:-.junctura/portal-api.env}
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
