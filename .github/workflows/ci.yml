name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify REUSE/SPDX license metadata
        run: |
          python -m pip install -r requirements-reuse.txt
          reuse lint
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate the pack format schemas
        run: |
          python -m pip install -r requirements-contracts.txt
          python scripts/check-pack-schemas.py
      - name: Validate the Tier 3 API contract
        run: python scripts/check-api-contract.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            packages/ui/package-lock.json
            server/package-lock.json
            app/package-lock.json
      # The CI guards of issue #14 run before any npm application install: they
      # scan the runtime sources with the pinned Node and no dependencies.
      - name: Run the CI guard fixture tests
        run: npm run test:guards
      - name: Check sector-neutral runtime code
        run: npm run check:neutral
      - name: Check runtime storage boundaries
        run: npm run check:storage
      - name: Read the pinned Junctura Health revision
        id: health
        run: |
          revision=$(cat .junctura-health-version)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$revision" >> "$GITHUB_OUTPUT"
      # The Health checkout is a CI input for exactly one thing: checking the
      # pinned real Health pack through readPack (scripts/check-health-pack.mjs).
      # The portal itself builds from this repository alone.
      - name: Check out the pinned Junctura Health pack
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: vku2-open-source-2026/junctura-health
          ref: ${{ steps.health.outputs.ref }}
          path: .junctura-health
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pack/
          persist-credentials: false
      # The dependency order is deliberate and holds on a clean runner:
      # scripts/check-health-pack.mjs imports server/packs.mjs, which needs the
      # server's locked dependencies (ajv, saxes) from server/node_modules. The
      # locked backend install therefore precedes the pinned Health checker,
      # which precedes the backend tests; the backend is installed exactly
      # once, and the frontend workload stays last.
      - name: Install the backend dependencies
        run: npm --prefix server ci --prefer-offline --no-audit --no-fund
      - name: Check the pinned Junctura Health pack
        run: node scripts/check-health-pack.mjs
      - name: Test the backend
        run: npm --prefix server test
      - name: Typecheck, test, build and pack @junctura/ui
        run: |
          npm --prefix packages/ui ci --prefer-offline --no-audit --no-fund
          npm --prefix packages/ui run typecheck
          npm --prefix packages/ui test
          npm --prefix packages/ui run build
          npm pack ./packages/ui --pack-destination "$RUNNER_TEMP"
      - name: Install the frontend dependencies
        run: npm --prefix app ci --prefer-offline --no-audit --no-fund
      - name: Typecheck, test and build the frontend
        run: |
          npm --prefix app run typecheck
          npm --prefix app test
          npm --prefix app run build
